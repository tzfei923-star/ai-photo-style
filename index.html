<!doctype html>
<!--
  這個檔案只給 GitHub Pages 用，是網站的入口首頁。
  Node 伺服器（server.js）是從 public/ 提供靜態檔，不會用到這個檔案，兩者互不影響。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>峽谷選角機</title>
<meta name="description" content="激鬥峽谷五路強勢角色分析。">
<link rel="canonical" href="./public/wildrift/">
<meta http-equiv="refresh" content="0; url=./public/wildrift/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap">
<style>
  :root{
    --sky:#9ED7F5; --sky-2:#BCE4F9; --paper:#FFF6E5; --ink:#2B2140; --ink-2:#6B6183; --pink:#FF7EB6;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background-color:var(--sky);
    background-image:
      linear-gradient(var(--sky-2) 2px,transparent 2px),
      linear-gradient(90deg,var(--sky-2) 2px,transparent 2px);
    background-size:24px 24px;
    display:grid;place-items:center;padding:24px;
  }
  .card{
    background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
    padding:28px 30px;text-align:center;max-width:420px;
  }
  h1{font-family:"Press Start 2P",monospace;font-size:18px;line-height:1.6;margin:0 0 6px}
  .sub{font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:2px;color:var(--ink-2);margin-bottom:20px}
  p{font-size:14px;font-weight:700;line-height:1.7;margin:0 0 18px}
  a.go{
    display:inline-block;font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:1px;
    background:var(--pink);color:var(--ink);text-decoration:none;
    border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 16px;
  }
  a.go:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  a.go:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
</style>
</head>
<body>
  <div class="card">
    <h1>峽谷選角機</h1>
    <div class="sub">WILD RIFT PICK ANALYZER</div>
    <p>正在前往選角機⋯⋯<br>如果沒有自動跳轉，請按下面的按鈕。</p>
    <a class="go" href="./public/wildrift/">開始選角 ▶</a>
  </div>
</body>
</html>
