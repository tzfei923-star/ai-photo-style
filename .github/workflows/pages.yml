# 自動部署 GitHub Pages
#
# 這個流程會在推送到 master 時執行，並且會自動幫這個 repo 開啟 GitHub Pages
# （configure-pages 的 enablement: true），所以不需要手動到 Settings 裡設定。
#
# 刻意拆成 build 與 deploy 兩個工作：job 層的 environment 會在工作啟動時就解析，
# 而 github-pages 這個環境要等 Pages 被啟用後才存在。先在沒有 environment 的
# build 工作裡啟用 Pages，deploy 工作啟動時環境就已經就緒。
#
# 網站內容就是 repo 根目錄：根目錄的 index.html 會轉址到 public/wildrift/ 選角機。

name: 部署 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，且不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Pages（尚未啟用時會自動啟用）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
